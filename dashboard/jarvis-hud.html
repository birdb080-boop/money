<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS · Team Miranda</title>
<style>
  :root{
    --gold:#d4af37; --gold-bright:#ffd86b; --amber:#ff9d2f;
    --cyan:#46e0ff; --risk:#ff4d4d; --wait:#ffc24d; --ok:#5dffa0;
    --bg:#05070d; --line:rgba(212,175,55,.22); --txt:#f3e9cf; --dim:#9c8f6e;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 800px at 50% 35%, rgba(212,175,55,.10), transparent 60%),
      radial-gradient(900px 600px at 50% 120%, rgba(70,224,255,.07), transparent 60%),
      var(--bg);
    color:var(--txt); font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;
    overflow:hidden; height:100vh; letter-spacing:.04em; -webkit-font-smoothing:antialiased;
  }
  body::before{content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:linear-gradient(rgba(212,175,55,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(212,175,55,.05) 1px,transparent 1px);
    background-size:46px 46px; mask:radial-gradient(circle at 50% 45%,#000 30%,transparent 80%)}
  body::after{content:""; position:fixed; left:0; right:0; height:140px; pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(70,224,255,.06),transparent);
    animation:scan 7s linear infinite; z-index:2}
  @keyframes scan{0%{top:-160px}100%{top:100%}}
  .bracket{position:fixed; width:54px; height:54px; border:2px solid var(--line); z-index:3}
  .bracket.tl{top:18px;left:18px;border-right:0;border-bottom:0}
  .bracket.tr{top:18px;right:18px;border-left:0;border-bottom:0}
  .bracket.bl{bottom:18px;left:18px;border-right:0;border-top:0}
  .bracket.br{bottom:18px;right:18px;border-left:0;border-top:0}

  .wrap{position:relative; z-index:4; height:100vh; display:grid;
    grid-template-rows:auto 1fr auto auto; padding:22px 38px 12px; gap:8px}
  .top{display:flex; justify-content:space-between; align-items:center}
  .brand{font-weight:700; font-size:21px; letter-spacing:.32em; color:var(--gold-bright);
    text-shadow:0 0 18px rgba(212,175,55,.5)}
  .brand small{display:block; font-size:11px; color:var(--dim); letter-spacing:.42em; margin-top:3px}
  .clock{text-align:right; font-variant-numeric:tabular-nums}
  .clock .t{font-size:28px; font-weight:700; color:var(--gold-bright)}
  .clock .d{font-size:12px; color:var(--dim); letter-spacing:.3em}

  .grid{display:grid; grid-template-columns:1fr 1.1fr 1fr; gap:20px; align-items:center; min-height:0}
  .panel{border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(212,175,55,.06),rgba(212,175,55,.015));
    border-radius:10px; padding:16px 18px; box-shadow:inset 0 0 30px rgba(212,175,55,.04)}
  .panel h2{font-size:12px; letter-spacing:.3em; color:var(--gold); font-weight:600;
    margin-bottom:12px; display:flex; align-items:center; gap:8px}
  .panel h2::before{content:""; width:7px; height:7px; background:var(--gold); border-radius:50%;
    box-shadow:0 0 10px var(--gold); animation:blink 2.2s infinite}
  @keyframes blink{50%{opacity:.25}}

  .deal{display:flex; align-items:center; gap:11px; padding:8px 0; border-bottom:1px dashed rgba(212,175,55,.12)}
  .deal:last-child{border-bottom:0}
  .dot{width:11px; height:11px; border-radius:50%; flex:0 0 auto}
  .dot.risk{background:var(--risk); box-shadow:0 0 12px var(--risk); animation:blink 1.1s infinite}
  .dot.wait{background:var(--wait); box-shadow:0 0 12px var(--wait)}
  .dot.ok{background:var(--ok); box-shadow:0 0 12px var(--ok)}
  .deal .nm{font-weight:700; font-size:16px; color:#fff}
  .deal .meta{font-size:11px; color:var(--dim); letter-spacing:.1em; text-transform:uppercase}
  .deal .stg{margin-left:auto; font-size:10px; color:var(--gold); border:1px solid var(--line);
    padding:3px 8px; border-radius:20px; white-space:nowrap}

  .reactor{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px}
  .core{position:relative; width:240px; height:240px}
  .ring{position:absolute; inset:0; border-radius:50%; border:2px solid rgba(212,175,55,.35)}
  .ring.r2{inset:22px; border-color:rgba(70,224,255,.3); border-style:dashed; animation:spin 14s linear infinite}
  .ring.r3{inset:44px; border-color:rgba(212,175,55,.5); animation:spin 9s linear infinite reverse}
  .ring.r4{inset:72px; border-color:rgba(70,224,255,.5)}
  @keyframes spin{100%{transform:rotate(360deg)}}
  .glow{position:absolute; inset:90px; border-radius:50%;
    background:radial-gradient(circle,var(--gold-bright),var(--amber) 55%,transparent 75%);
    box-shadow:0 0 70px 16px rgba(212,175,55,.55), inset 0 0 40px rgba(255,255,255,.5);
    animation:pulse 3s ease-in-out infinite; transition:.3s}
  @keyframes pulse{50%{transform:scale(1.07)}}
  .core.listening .glow{background:radial-gradient(circle,#bff4ff,var(--cyan) 55%,transparent 75%);
    box-shadow:0 0 90px 22px rgba(70,224,255,.7), inset 0 0 50px #fff}
  .core .pct{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2}
  .core .pct b{font-size:40px; color:#0a0a0a; font-weight:800; line-height:1}
  .core .pct span{font-size:9px; color:#1a1a1a; letter-spacing:.3em; font-weight:700}
  .greet .hi{font-size:22px; color:var(--gold-bright); font-weight:700; text-align:center; text-shadow:0 0 16px rgba(212,175,55,.5)}
  .greet .sub{font-size:12px; color:var(--dim); letter-spacing:.16em; text-align:center; margin-top:3px}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; width:100%}
  .stat{border:1px solid var(--line); border-radius:8px; padding:8px 4px; text-align:center}
  .stat b{display:block; font-size:23px; color:var(--gold-bright); line-height:1}
  .stat span{font-size:9px; color:var(--dim); letter-spacing:.16em}

  .prio{display:flex; gap:10px; padding:9px 0; border-bottom:1px dashed rgba(212,175,55,.12); align-items:flex-start}
  .prio:last-child{border-bottom:0}
  .prio .n{font-size:12px; font-weight:800; color:#05070d; background:var(--gold-bright);
    min-width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center}
  .prio .txt{font-size:14px; line-height:1.3}

  /* conversation strip */
  .convo{border:1px solid var(--line); border-radius:10px; padding:10px 16px; min-height:54px;
    background:rgba(70,224,255,.04); display:flex; flex-direction:column; gap:3px; justify-content:center}
  .convo .you{font-size:13px; color:var(--dim); letter-spacing:.04em}
  .convo .you b{color:var(--cyan)}
  .convo .jv{font-size:16px; color:var(--gold-bright); letter-spacing:.03em}
  .convo .jv b{color:var(--gold)}

  .bottom{display:flex; align-items:center; gap:12px; padding-top:4px}
  .mic{font-family:inherit; cursor:pointer; letter-spacing:.14em; font-weight:700; font-size:14px;
    background:linear-gradient(180deg,rgba(212,175,55,.25),rgba(212,175,55,.08));
    color:var(--gold-bright); border:1px solid var(--gold); padding:13px 22px; border-radius:8px;
    transition:.2s; box-shadow:0 0 16px rgba(212,175,55,.25); white-space:nowrap}
  .mic:hover{box-shadow:0 0 26px rgba(212,175,55,.5)}
  .mic.on{background:linear-gradient(180deg,rgba(70,224,255,.3),rgba(70,224,255,.1));
    color:#bff4ff; border-color:var(--cyan); box-shadow:0 0 26px rgba(70,224,255,.6);
    animation:micpulse 1.2s infinite}
  @keyframes micpulse{50%{box-shadow:0 0 40px rgba(70,224,255,.9)}}
  #say{flex:1; background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:8px;
    color:var(--txt); font-family:inherit; font-size:15px; padding:12px 16px; letter-spacing:.03em}
  #say::placeholder{color:var(--dim)}
  .btn{font-family:inherit; cursor:pointer; letter-spacing:.12em; font-weight:700; font-size:12px;
    background:transparent; color:var(--gold); border:1px solid var(--line); padding:12px 14px;
    border-radius:8px; transition:.2s; white-space:nowrap}
  .btn:hover{background:rgba(212,175,55,.12)}

  #boot{position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:24px; cursor:pointer}
  #boot h1{font-size:32px; letter-spacing:.4em; color:var(--gold-bright); text-shadow:0 0 24px rgba(212,175,55,.6)}
  #boot .bigring{width:110px; height:110px; border-radius:50%;
    border:3px solid rgba(212,175,55,.3); border-top-color:var(--gold-bright); animation:spin 1.1s linear infinite}
  #boot .bt{font-size:14px; color:var(--gold); letter-spacing:.28em}
  #boot .go{font-size:13px; color:var(--dim); letter-spacing:.26em; animation:blink 1.4s infinite}
  .hidden{display:none!important}
</style>
</head>
<body>
  <div class="bracket tl"></div><div class="bracket tr"></div>
  <div class="bracket bl"></div><div class="bracket br"></div>

  <div id="boot">
    <h1>J · A · R · V · I · S</h1>
    <div class="bigring"></div>
    <div class="bt">TEAM MIRANDA · MORTGAGE COMMAND</div>
    <div class="go">▶ CLICK TO INITIALIZE</div>
  </div>

  <div class="wrap">
    <div class="top">
      <div class="brand">TEAM MIRANDA<small id="unit">V.I.P. MORTGAGE · MK II</small></div>
      <div class="clock"><div class="t" id="clk">--:--:--</div><div class="d" id="dte">—</div></div>
    </div>

    <div class="grid">
      <div class="panel"><h2>ACTIVE PIPELINE</h2><div id="deals"></div></div>
      <div class="reactor">
        <div class="core" id="core">
          <div class="ring r1"></div><div class="ring r2"></div>
          <div class="ring r3"></div><div class="ring r4"></div>
          <div class="glow"></div>
          <div class="pct"><b id="goalPct">0%</b><span>TO GOAL</span></div>
        </div>
        <div class="greet"><div class="hi" id="hi">Good day, Operator.</div>
          <div class="sub" id="status">SYSTEMS NOMINAL</div></div>
        <div class="stats">
          <div class="stat"><b id="sActive">0</b><span>ACTIVE</span></div>
          <div class="stat"><b id="sRisk" style="color:var(--risk)">0</b><span>AT RISK</span></div>
          <div class="stat"><b id="sClosed">0</b><span>CLOSED MO</span></div>
        </div>
      </div>
      <div class="panel"><h2>PRIORITY DIRECTIVES</h2><div id="prios"></div></div>
    </div>

    <div class="convo">
      <div class="you" id="youLine">&nbsp;</div>
      <div class="jv" id="jvLine">Click <b>TALK</b> and say "brief me", or "add a deal…"</div>
    </div>

    <div class="bottom">
      <button class="mic" id="micBtn">🎤 TALK TO JARVIS</button>
      <input id="say" placeholder="…or type here and press Enter (e.g. add deal Sarah Lee conventional processing)" />
      <button class="btn" id="voiceBtn">🔊 ON</button>
      <button class="btn" id="saveBtn">💾 EXPORT</button>
      <button class="btn" id="resetBtn">⟲ BRIEF</button>
    </div>
  </div>

  <script>
/* JARVIS data feed — JARVIS updates this when you run /intake or /learn.
   Edit by hand anytime, or just tell JARVIS "update the HUD". */
window.JARVIS_DATA = {
  operator: "Martin",
  team: "TEAM MIRANDA",
  unit: "V.I.P. MORTGAGE",
  mark: "MK I",

  // Your live deals. stage: Lead | App | Processing | Underwriting | CTC | Closed
  // flag: "risk" (needs you / at risk) | "wait" (waiting on others) | "ok"
  deals: [
    { name: "Sarah L.",  type: "Conventional", stage: "Processing",   flag: "risk", next: "Send updated paystubs request", close: "06/30" },
    { name: "The Garcias", type: "Refi watch",  stage: "Lead",        flag: "ok",   next: "Quarterly check-in",          close: "" },
    { name: "James R.",  type: "VA Purchase",   stage: "Underwriting", flag: "wait", next: "Waiting on appraisal",        close: "07/10" },
    { name: "Mendez Fam.", type: "FHA Purchase", stage: "App",        flag: "risk", next: "Collect bank statements",      close: "" }
  ],

  // Top priorities JARVIS reads aloud (keep to 3 — ADHD mode)
  priorities: [
    "Sarah L. — request updated paystubs before processing stalls.",
    "Mendez family — collect bank statements to keep the app moving.",
    "Post today's pre-approval flyer and reply to every DM."
  ],

  // One-line market / motivation note for the ticker
  ticker: "LOCAL EXPERTS · REAL PEOPLE · REAL RESULTS · LET'S GET YOU HOME",

  monthClosed: 3,      // closings logged this month (momentum fuel)
  monthGoal: 8         // your target
};

</script>
  <script>
  /* ===== state: defaults merged with anything saved locally (this is how it GROWS) ===== */
  const DEFAULTS = window.JARVIS_DATA || {operator:"Martin", team:"TEAM MIRANDA",
    unit:"V.I.P. MORTGAGE", deals:[], priorities:[], notes:[], ticker:"TEAM MIRANDA",
    monthClosed:0, monthGoal:8};
  let D;
  try{ const saved=JSON.parse(localStorage.getItem("JARVIS_DATA")); D = saved? {...DEFAULTS,...saved} : structuredClone(DEFAULTS);}
  catch(e){ D = structuredClone(DEFAULTS); }
  D.deals=D.deals||[]; D.priorities=D.priorities||[]; D.notes=D.notes||[];
  function save(){ localStorage.setItem("JARVIS_DATA", JSON.stringify(D)); }

  const $=id=>document.getElementById(id);
  const STAGES={lead:"Lead",app:"App",application:"App",processing:"Processing",
    underwriting:"Underwriting",ctc:"CTC","clear to close":"CTC",closed:"Closed",funded:"Closed"};
  const TYPES=["conventional","fha","va","jumbo","refi","refinance","usda","heloc"];

  /* ===== render ===== */
  function render(){
    $("unit").textContent=(D.unit||"")+" · MK II";
    const active=D.deals.filter(d=>d.stage!=="Closed").length;
    const risk=D.deals.filter(d=>d.flag==="risk").length;
    $("sActive").textContent=active; $("sRisk").textContent=risk; $("sClosed").textContent=D.monthClosed||0;
    $("goalPct").textContent=(D.monthGoal?Math.round(((D.monthClosed||0)/D.monthGoal)*100):0)+"%";
    $("deals").innerHTML=D.deals.length? D.deals.map(d=>`
      <div class="deal"><div class="dot ${d.flag||'ok'}"></div>
        <div><div class="nm">${d.name}</div>
          <div class="meta">${[d.type,d.next].filter(Boolean).join(' · ')||'—'}</div></div>
        <div class="stg">${d.stage||'Lead'}</div></div>`).join("")
      : '<div class="meta">No deals yet. Say "add a deal…"</div>';
    $("prios").innerHTML=(D.priorities||[]).length? D.priorities.map((p,i)=>`
      <div class="prio"><div class="n">${i+1}</div><div class="txt">${p}</div></div>`).join("")
      : '<div class="meta">Say "remind me to…" to add directives.</div>';
    $("hi").textContent=greeting()+", "+(D.operator||"Operator")+".";
    $("status").textContent=risk>0?(risk+" DEAL"+(risk>1?"S":"")+" NEED YOUR ATTENTION"):"ALL SYSTEMS NOMINAL";
    save();
  }
  function greeting(){const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening";}
  function clock(){const n=new Date();
    $("clk").textContent=n.toLocaleTimeString("en-US",{hour12:false});
    $("dte").textContent=n.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}).toUpperCase();}
  setInterval(clock,1000); clock();

  /* ===== voice out ===== */
  let voiceOn=true, speaking=false;
  function pickVoice(){const vs=speechSynthesis.getVoices();
    const pref=["Daniel","Google UK English Male","Arthur","Oliver","Microsoft Ryan","Microsoft George","Alex"];
    for(const n of pref){const v=vs.find(x=>x.name.includes(n)); if(v) return v;}
    return vs.find(v=>/en-GB/.test(v.lang))||vs.find(v=>/en/.test(v.lang))||vs[0];}
  function jarvis(text){
    $("jvLine").innerHTML="<b>JARVIS:</b> "+text;
    if(!voiceOn||!("speechSynthesis" in window)) return;
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(); if(v) u.voice=v; u.rate=.93; u.pitch=.8;
    speaking=true; if(rec&&listening){try{rec.stop()}catch(e){}}
    u.onend=()=>{speaking=false; if(listening){try{rec.start()}catch(e){}}};
    speechSynthesis.speak(u);
  }

  /* ===== brain: turn what you say into actions (this is the "grow as we talk") ===== */
  function handle(raw){
    const t=raw.trim(); if(!t) return;
    $("youLine").innerHTML="<b>You:</b> "+t;
    const s=t.toLowerCase();

    // brief / status
    if(/\b(brief|briefing|status|pipeline|how am i|what'?s? up|update me|rundown)\b/.test(s)) return jarvis(briefing());
    // help
    if(/\b(help|what can you do|commands)\b/.test(s)) return jarvis("You can say: add a deal, then a name, loan type and stage. Mark a deal closed. Flag a deal at risk. Set a reminder. Set my goal to a number. Or say brief me for your rundown.");
    // set goal
    let m=s.match(/goal (?:to |is |of )?(\d+)/); if(m){D.monthGoal=+m[1]; render(); return jarvis(`Understood. Monthly goal set to ${m[1]} units. You're at ${D.monthClosed||0}.`);}
    // closed / funded
    if(/\b(closed|funded|close out|mark .* done|we closed)\b/.test(s)){
      const d=findDeal(s); if(d){d.stage="Closed"; d.flag="ok"; D.monthClosed=(D.monthClosed||0)+1; render();
        return jarvis(`Outstanding. ${d.name} marked closed. That's ${D.monthClosed} this month — ${Math.max(0,(D.monthGoal||0)-D.monthClosed)} to goal. Let's get the next one.`);}
      return jarvis("Which file closed? Try: close out Sarah Lee.");
    }
    // risk / waiting flags
    if(/\b(at risk|flag|stalled|urgent|chase)\b/.test(s)){const d=findDeal(s); if(d){d.flag="risk"; render(); return jarvis(`Flagged. ${d.name} is now top priority.`);}}
    if(/\bwaiting\b/.test(s)){const d=findDeal(s); if(d){d.flag="wait"; const mm=s.match(/waiting on (.+)/); if(mm) d.next="Waiting on "+mm[1]; render(); return jarvis(`Noted. ${d.name} is waiting${d.next?', '+d.next.toLowerCase():''}.`);}}
    // reminder / directive
    m=t.match(/\b(?:remind me to|reminder|add (?:a )?(?:task|directive)|note)\s+(?:to\s+)?(.+)/i);
    if(m){D.priorities.unshift(cap(m[1])); D.priorities=D.priorities.slice(0,6); render(); return jarvis(`Logged. "${m[1]}" added to your directives.`);}
    // remember a fact
    m=t.match(/\bremember(?: that)?\s+(.+)/i);
    if(m){D.notes.unshift(m[1]); render(); return jarvis(`I'll remember that. ${cap(m[1])}.`);}
    // add deal
    if(/\b(add|new|create)\b.*\b(deal|file|client|loan|borrower)\b/.test(s) || /^(add|new) /.test(s)){
      const d=parseDeal(t); if(d.name){D.deals.unshift(d); render();
        return jarvis(`Added ${d.name} — ${d.type||'loan'}, ${d.stage}. ${d.flag==='risk'?'Marked as needing your attention. ':''}Anything else?`);}
      return jarvis("Tell me the name, loan type and stage. For example: add a deal, Sarah Lee, conventional, processing.");
    }
    // next step update
    m=t.match(/(.+?)\b(?:next step|next|needs to|needs|todo)\b\s+(.+)/i);
    if(m){const d=findDeal(m[1].toLowerCase()); if(d){d.next=cap(m[2]); render(); return jarvis(`Updated. Next on ${d.name}: ${m[2]}.`);}}
    // pleasantries
    if(/\b(thank|thanks|appreciate)\b/.test(s)) return jarvis("Always, sir. Let's get you home.");
    if(/\b(hello|hey|hi|you there|jarvis)\b/.test(s)) return jarvis(`${greeting()}, ${D.operator}. JARVIS online and listening.`);
    // fallback: treat as a quick note so nothing is lost
    D.notes.unshift(t); render();
    jarvis(`Noted. I saved that. Say "brief me" for your rundown, or "help" for what I can do.`);
  }

  function briefing(){
    const active=D.deals.filter(d=>d.stage!=="Closed").length;
    const risk=D.deals.filter(d=>d.flag==="risk");
    let s=`${greeting()}, ${D.operator||"sir"}. `;
    s+=`${active} active file${active!==1?'s':''} in the pipeline`;
    s+=risk.length?`, ${risk.length} needing your attention. `:`. All nominal. `;
    if(D.priorities[0]) s+=`Priority one: ${D.priorities[0]} `;
    s+=`You've closed ${D.monthClosed||0} of ${D.monthGoal||0} this month. Let's get you home.`;
    return s;
  }
  function findDeal(s){return D.deals.find(d=>s.includes(d.name.toLowerCase().split(' ')[0]))
    ||D.deals.find(d=>s.includes(d.name.toLowerCase()));}
  function parseDeal(t){
    let body=t.replace(/^.*?\b(deal|file|client|loan|borrower)\b[:,]?\s*/i,"")
              .replace(/^(add|new|create)\s+(a\s+)?/i,"");
    const parts=body.split(/[,]| for | who | and /i).map(x=>x.trim()).filter(Boolean);
    const d={name:"",type:"",stage:"Lead",flag:"ok",next:""};
    const leftover=[];
    parts.forEach((p,i)=>{
      const pl=p.toLowerCase();
      const st=Object.keys(STAGES).find(k=>pl.includes(k));
      const ty=TYPES.find(k=>pl.includes(k));
      if(i===0){d.name=cap(p);}
      else if(st){d.stage=STAGES[st];}
      else if(ty){d.type=cap(ty.replace("refinance","refi"));}
      else if(/risk|urgent|asap/.test(pl)){d.flag="risk";}
      else leftover.push(p);
    });
    // also catch type/stage if they were in the name chunk
    if(!d.type){const ty=TYPES.find(k=>d.name.toLowerCase().includes(k)); if(ty){d.type=cap(ty); d.name=cap(d.name.replace(new RegExp(ty,"i"),"").trim());}}
    if(leftover.length) d.next=cap(leftover.join(", "));
    return d;
  }
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

  /* ===== voice in (talk to it) ===== */
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null, listening=false;
  if(SR){ rec=new SR(); rec.lang="en-US"; rec.interimResults=false; rec.continuous=true;
    rec.onresult=e=>{const r=e.results[e.results.length-1]; if(r.isFinal) handle(r[0].transcript);};
    rec.onerror=e=>{ if(e.error==="not-allowed"){jarvis("I need microphone access. Enable it and click TALK again."); stopMic();} };
    rec.onend=()=>{ if(listening&&!speaking){try{rec.start()}catch(e){}} };
  }
  function startMic(){ if(!rec){jarvis("Voice input needs Chrome or Edge. You can type to me instead."); return;}
    listening=true; $("micBtn").classList.add("on"); $("micBtn").textContent="🎙️ LISTENING…";
    $("core").classList.add("listening"); try{rec.start()}catch(e){} }
  function stopMic(){ listening=false; $("micBtn").classList.remove("on"); $("micBtn").textContent="🎤 TALK TO JARVIS";
    $("core").classList.remove("listening"); if(rec){try{rec.stop()}catch(e){}} }

  /* ===== wiring ===== */
  $("micBtn").onclick=()=> listening?stopMic():startMic();
  $("say").addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.value.trim()){handle(e.target.value); e.target.value="";}});
  $("voiceBtn").onclick=e=>{voiceOn=!voiceOn; e.target.textContent="🔊 "+(voiceOn?"ON":"OFF"); if(!voiceOn)speechSynthesis.cancel();};
  $("resetBtn").onclick=()=>jarvis(briefing());
  $("saveBtn").onclick=()=>{ const blob=new Blob(["window.JARVIS_DATA = "+JSON.stringify(D,null,2)+";\n"],{type:"text/javascript"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="data.js"; a.click();
    jarvis("Exported. Drop that data.js back into your dashboard folder to sync your pipeline."); };

  $("boot").onclick=()=>{ $("boot").classList.add("hidden"); render(); jarvis(briefing());
    if("speechSynthesis" in window) speechSynthesis.onvoiceschanged=()=>{}; };

  render();
  </script>
</body>
</html>
