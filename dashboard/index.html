<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS · Team Miranda</title>
<style>
  :root{
    --gold:#d4af37; --gold-bright:#ffd86b; --amber:#ff9d2f;
    --cyan:#46e0ff; --risk:#ff4d4d; --wait:#ffc24d; --ok:#5dffa0;
    --bg:#05070d; --panel:rgba(212,175,55,.05); --line:rgba(212,175,55,.22);
    --txt:#f3e9cf; --dim:#9c8f6e;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 800px at 50% 38%, rgba(212,175,55,.10), transparent 60%),
      radial-gradient(900px 600px at 50% 120%, rgba(70,224,255,.07), transparent 60%),
      var(--bg);
    color:var(--txt); font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;
    overflow:hidden; height:100vh; letter-spacing:.04em;
    -webkit-font-smoothing:antialiased;
  }
  /* faint HUD grid + scan line */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:
      linear-gradient(rgba(212,175,55,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,175,55,.05) 1px, transparent 1px);
    background-size:46px 46px;
    mask:radial-gradient(circle at 50% 45%, #000 30%, transparent 80%);
  }
  body::after{
    content:""; position:fixed; left:0; right:0; height:140px; pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(70,224,255,.06), transparent);
    animation:scan 7s linear infinite; z-index:2;
  }
  @keyframes scan{0%{top:-160px}100%{top:100%}}

  /* corner brackets */
  .bracket{position:fixed; width:54px; height:54px; border:2px solid var(--line); z-index:3}
  .bracket.tl{top:18px; left:18px; border-right:0; border-bottom:0}
  .bracket.tr{top:18px; right:18px; border-left:0; border-bottom:0}
  .bracket.bl{bottom:18px; left:18px; border-right:0; border-top:0}
  .bracket.br{bottom:18px; right:18px; border-left:0; border-top:0}

  .wrap{position:relative; z-index:4; height:100vh; display:grid;
    grid-template-rows:auto 1fr auto; padding:26px 40px 14px; gap:10px}

  /* top bar */
  .top{display:flex; justify-content:space-between; align-items:center}
  .brand{font-weight:700; font-size:22px; letter-spacing:.32em; color:var(--gold-bright);
    text-shadow:0 0 18px rgba(212,175,55,.5)}
  .brand small{display:block; font-size:11px; color:var(--dim); letter-spacing:.45em; margin-top:3px}
  .clock{text-align:right; font-variant-numeric:tabular-nums}
  .clock .t{font-size:30px; font-weight:700; color:var(--gold-bright); letter-spacing:.08em}
  .clock .d{font-size:12px; color:var(--dim); letter-spacing:.3em}

  /* main 3-column */
  .grid{display:grid; grid-template-columns:1fr 1.15fr 1fr; gap:22px; align-items:center; min-height:0}

  .panel{border:1px solid var(--line); background:
      linear-gradient(180deg, rgba(212,175,55,.06), rgba(212,175,55,.015));
    border-radius:10px; padding:18px 20px; position:relative; backdrop-filter:blur(2px);
    box-shadow:inset 0 0 30px rgba(212,175,55,.04)}
  .panel h2{font-size:12px; letter-spacing:.32em; color:var(--gold); font-weight:600;
    margin-bottom:14px; display:flex; align-items:center; gap:8px}
  .panel h2::before{content:""; width:7px; height:7px; background:var(--gold); border-radius:50%;
    box-shadow:0 0 10px var(--gold); animation:blink 2.2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  .col{display:flex; flex-direction:column; gap:18px}

  /* deals */
  .deal{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px dashed rgba(212,175,55,.12)}
  .deal:last-child{border-bottom:0}
  .dot{width:11px; height:11px; border-radius:50%; flex:0 0 auto}
  .dot.risk{background:var(--risk); box-shadow:0 0 12px var(--risk); animation:blink 1.1s infinite}
  .dot.wait{background:var(--wait); box-shadow:0 0 12px var(--wait)}
  .dot.ok{background:var(--ok); box-shadow:0 0 12px var(--ok)}
  .deal .nm{font-weight:700; font-size:17px; color:#fff}
  .deal .meta{font-size:11px; color:var(--dim); letter-spacing:.12em; text-transform:uppercase}
  .deal .stg{margin-left:auto; font-size:11px; color:var(--gold); border:1px solid var(--line);
    padding:3px 9px; border-radius:20px; white-space:nowrap}

  /* arc reactor center */
  .reactor{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px}
  .core{position:relative; width:280px; height:280px}
  .ring{position:absolute; inset:0; border-radius:50%; border:2px solid rgba(212,175,55,.35)}
  .ring.r2{inset:26px; border-color:rgba(70,224,255,.30); border-style:dashed; animation:spin 14s linear infinite}
  .ring.r3{inset:52px; border-color:rgba(212,175,55,.5); animation:spin 9s linear infinite reverse}
  .ring.r4{inset:84px; border-color:rgba(70,224,255,.5)}
  @keyframes spin{100%{transform:rotate(360deg)}}
  .glow{position:absolute; inset:104px; border-radius:50%;
    background:radial-gradient(circle, var(--gold-bright), var(--amber) 55%, transparent 75%);
    box-shadow:0 0 70px 16px rgba(212,175,55,.55), inset 0 0 40px rgba(255,255,255,.5);
    animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.07); box-shadow:0 0 95px 26px rgba(255,180,60,.7), inset 0 0 50px #fff}}
  .core .pct{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; z-index:2}
  .core .pct b{font-size:46px; color:#0a0a0a; font-weight:800; line-height:1}
  .core .pct span{font-size:10px; color:#1a1a1a; letter-spacing:.3em; font-weight:700}
  .greet{text-align:center}
  .greet .hi{font-size:24px; color:var(--gold-bright); font-weight:700; text-shadow:0 0 16px rgba(212,175,55,.5)}
  .greet .sub{font-size:13px; color:var(--dim); letter-spacing:.18em; margin-top:4px}

  /* stat chips */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:4px}
  .stat{border:1px solid var(--line); border-radius:8px; padding:10px 6px; text-align:center}
  .stat b{display:block; font-size:26px; color:var(--gold-bright); line-height:1}
  .stat span{font-size:9px; color:var(--dim); letter-spacing:.18em}

  /* priorities */
  .prio{display:flex; gap:11px; padding:11px 0; border-bottom:1px dashed rgba(212,175,55,.12); align-items:flex-start}
  .prio:last-child{border-bottom:0}
  .prio .n{font-size:13px; font-weight:800; color:#05070d; background:var(--gold-bright);
    min-width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 12px rgba(212,175,55,.6)}
  .prio .txt{font-size:15px; color:var(--txt); line-height:1.32}

  /* ticker + voice */
  .bottom{display:flex; align-items:center; gap:18px; border-top:1px solid var(--line); padding-top:10px}
  .tickwrap{flex:1; overflow:hidden; white-space:nowrap}
  .tick{display:inline-block; padding-left:100%; animation:tk 26s linear infinite;
    color:var(--gold); letter-spacing:.32em; font-size:13px}
  @keyframes tk{100%{transform:translateX(-100%)}}
  button{font-family:inherit; cursor:pointer; letter-spacing:.18em; font-weight:700;
    background:transparent; color:var(--gold-bright); border:1px solid var(--gold);
    padding:11px 20px; border-radius:6px; font-size:13px; transition:.2s;
    box-shadow:0 0 16px rgba(212,175,55,.25)}
  button:hover{background:rgba(212,175,55,.15); box-shadow:0 0 26px rgba(212,175,55,.5)}

  /* boot overlay */
  #boot{position:fixed; inset:0; z-index:50; background:var(--bg); display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:26px; cursor:pointer}
  #boot .bigring{width:120px; height:120px; border-radius:50%;
    border:3px solid rgba(212,175,55,.3); border-top-color:var(--gold-bright); animation:spin 1.1s linear infinite}
  #boot .bt{font-size:15px; color:var(--gold); letter-spacing:.3em}
  #boot .go{font-size:13px; color:var(--dim); letter-spacing:.28em; animation:blink 1.4s infinite}
  #boot h1{font-size:34px; letter-spacing:.4em; color:var(--gold-bright); text-shadow:0 0 24px rgba(212,175,55,.6)}
  .hidden{display:none!important}
  .subtitle{position:fixed; bottom:78px; left:50%; transform:translateX(-50%); z-index:6;
    max-width:70vw; text-align:center; font-size:15px; color:var(--cyan);
    text-shadow:0 0 16px rgba(70,224,255,.5); letter-spacing:.06em; min-height:22px}
</style>
</head>
<body>
  <div class="bracket tl"></div><div class="bracket tr"></div>
  <div class="bracket bl"></div><div class="bracket br"></div>

  <!-- BOOT -->
  <div id="boot">
    <h1>J · A · R · V · I · S</h1>
    <div class="bigring"></div>
    <div class="bt">TEAM MIRANDA · MORTGAGE COMMAND</div>
    <div class="go">▶ CLICK TO INITIALIZE</div>
  </div>

  <div class="wrap">
    <div class="top">
      <div class="brand" id="brand">TEAM MIRANDA
        <small id="unit">V.I.P. MORTGAGE · MK I</small></div>
      <div class="clock"><div class="t" id="clk">--:--:--</div><div class="d" id="dte">—</div></div>
    </div>

    <div class="grid">
      <!-- LEFT: pipeline -->
      <div class="col">
        <div class="panel">
          <h2>ACTIVE PIPELINE</h2>
          <div id="deals"></div>
        </div>
      </div>

      <!-- CENTER: reactor -->
      <div class="reactor">
        <div class="core">
          <div class="ring r1"></div><div class="ring r2"></div>
          <div class="ring r3"></div><div class="ring r4"></div>
          <div class="glow"></div>
          <div class="pct"><b id="goalPct">0%</b><span>TO GOAL</span></div>
        </div>
        <div class="greet">
          <div class="hi" id="hi">Good day, Operator.</div>
          <div class="sub" id="status">SYSTEMS NOMINAL</div>
        </div>
        <div class="stats">
          <div class="stat"><b id="sActive">0</b><span>ACTIVE</span></div>
          <div class="stat"><b id="sRisk" style="color:var(--risk)">0</b><span>AT RISK</span></div>
          <div class="stat"><b id="sClosed">0</b><span>CLOSED MO</span></div>
        </div>
      </div>

      <!-- RIGHT: priorities -->
      <div class="col">
        <div class="panel">
          <h2>PRIORITY DIRECTIVES</h2>
          <div id="prios"></div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <button id="speakBtn">⟳ RE-BRIEF</button>
      <div class="tickwrap"><div class="tick" id="tick">TEAM MIRANDA</div></div>
      <button id="voiceBtn">🔊 VOICE: ON</button>
    </div>
  </div>

  <div class="subtitle" id="subtitle"></div>

  <script src="data.js"></script>
  <script>
  const D = window.JARVIS_DATA || {};
  let voiceOn = true;

  /* ---------- render ---------- */
  function render(){
    document.getElementById('brand').firstChild.textContent = (D.team||'TEAM') + ' ';
    document.getElementById('unit').textContent = (D.unit||'') + ' · ' + (D.mark||'MK I');

    const deals = D.deals||[];
    const active = deals.filter(d=>d.stage!=='Closed').length;
    const risk = deals.filter(d=>d.flag==='risk').length;
    document.getElementById('sActive').textContent = active;
    document.getElementById('sRisk').textContent = risk;
    document.getElementById('sClosed').textContent = D.monthClosed||0;
    const pct = D.monthGoal ? Math.round(((D.monthClosed||0)/D.monthGoal)*100) : 0;
    document.getElementById('goalPct').textContent = pct + '%';

    document.getElementById('deals').innerHTML = deals.map(d=>`
      <div class="deal">
        <div class="dot ${d.flag}"></div>
        <div><div class="nm">${d.name}</div>
          <div class="meta">${d.type}${d.close? ' · CLOSE '+d.close:''} · ${d.next}</div></div>
        <div class="stg">${d.stage}</div>
      </div>`).join('') || '<div class="meta">No deals loaded. Run /intake.</div>';

    document.getElementById('prios').innerHTML = (D.priorities||[]).map((p,i)=>`
      <div class="prio"><div class="n">${i+1}</div><div class="txt">${p}</div></div>`).join('');

    document.getElementById('tick').textContent = (D.ticker||'TEAM MIRANDA') + '      ◆      ';
    document.getElementById('hi').textContent = greeting() + ', ' + (D.operator||'Operator') + '.';
    document.getElementById('status').textContent =
      risk>0 ? (risk + ' DEAL'+(risk>1?'S':'') + ' NEED YOUR ATTENTION') : 'ALL SYSTEMS NOMINAL';
  }

  function greeting(){
    const h=new Date().getHours();
    return h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  }

  /* ---------- clock ---------- */
  function tickClock(){
    const n=new Date();
    document.getElementById('clk').textContent = n.toLocaleTimeString('en-US',{hour12:false});
    document.getElementById('dte').textContent = n.toLocaleDateString('en-US',
      {weekday:'long', month:'short', day:'numeric'}).toUpperCase();
  }
  setInterval(tickClock,1000); tickClock();

  /* ---------- voice (JARVIS) ---------- */
  function pickVoice(){
    const vs = speechSynthesis.getVoices();
    // prefer a deep British male, else any English male, else any English
    const pref = ['Daniel','Google UK English Male','Arthur','Oliver','Microsoft Ryan','Microsoft George','Alex'];
    for(const name of pref){ const v=vs.find(x=>x.name.includes(name)); if(v) return v; }
    return vs.find(v=>/en-GB/.test(v.lang)) || vs.find(v=>/en/.test(v.lang)) || vs[0];
  }

  function speak(text){
    if(!voiceOn || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(); if(v) u.voice=v;
    u.rate=.92; u.pitch=.8; u.volume=1;     // calm, low, deliberate — JARVIS
    const sub=document.getElementById('subtitle');
    u.onstart=()=>sub.textContent=text;
    u.onend=()=>setTimeout(()=>{ if(!speechSynthesis.speaking) sub.textContent=''; },1200);
    speechSynthesis.speak(u);
  }

  function briefing(){
    const deals=D.deals||[];
    const risk=deals.filter(d=>d.flag==='risk');
    const active=deals.filter(d=>d.stage!=='Closed').length;
    let s = `${greeting()}, ${D.operator||'sir'}. JARVIS online. `;
    s += `You have ${active} active file${active!==1?'s':''} in the pipeline`;
    s += risk.length ? `, and ${risk.length} require${risk.length===1?'s':''} your attention today. ` : '. All systems nominal. ';
    if((D.priorities||[]).length){ s += `Priority one: ${D.priorities[0]} `; }
    s += `You have closed ${D.monthClosed||0} of ${D.monthGoal||0} this month. Let's get you home.`;
    return s;
  }

  /* ---------- boot ---------- */
  document.getElementById('boot').addEventListener('click', ()=>{
    document.getElementById('boot').classList.add('hidden');
    render();
    // voices may load async
    speak(briefing());
    if(speechSynthesis.onvoiceschanged !== undefined){
      speechSynthesis.onvoiceschanged = ()=>{};
    }
  });

  document.getElementById('speakBtn').addEventListener('click', ()=>speak(briefing()));
  document.getElementById('voiceBtn').addEventListener('click', (e)=>{
    voiceOn=!voiceOn;
    e.target.textContent = '🔊 VOICE: ' + (voiceOn?'ON':'OFF');
    if(!voiceOn) speechSynthesis.cancel();
  });

  render(); // initial paint behind boot screen
  </script>
</body>
</html>
