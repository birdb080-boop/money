name: Funnel test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate config + run end-to-end funnel test
        run: |
          node --check funnel/config.js
          node funnel/test/funnel.test.js
